# Authenticated S3 via s3proxy — GPU plugin overrides.
#
# Routes the GPU services from docker-compose.gpu-plugins.yml through s3proxy.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-plugins.yml \
#     -f docker-compose.s3proxy-auth.yml -f docker-compose.s3proxy-auth.gpu.yml up --build

x-s3proxy-gpu-env: &s3proxy-gpu-env
  S3_STORAGE_AWS_ENDPOINT_URL: http://s3proxy:80

services:
  rendering-job:
    environment:
      - S3_STORAGE_AWS_ENDPOINT_URL=http://s3proxy:80
    depends_on:
      s3proxy:
        condition: service_healthy

  monitor-worker-thumbnail-generation:
    environment:
      <<: *s3proxy-gpu-env

  monitor-worker-rendering-to-embedding:
    environment:
      <<: *s3proxy-gpu-env
