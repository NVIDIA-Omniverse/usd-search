[project]
name = "fs-watcher"
version = "0.1.0"
description = "Filesystem watcher that triggers USD Search reindexing on file changes"
authors = [
    {name = "NVIDIA Corporation"},
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "watchfiles>=1.0.0",
    "httpx>=0.27.0",
    "Pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Standalone uv project, excluded from the root workspace (see the root
# pyproject's `exclude`): as a member, its deps would land in the usdsearch
# image and THIRD_PARTY_NOTICE.md, neither of which ships the watcher.
[dependency-groups]
test = ["pytest>=8.0"]

# Stops pytest's inifile search here, so the workspace-root addopts (coverage,
# reruns, timeout plugins) don't apply to this env.
[tool.pytest.ini_options]
addopts = "-vv -ra"
