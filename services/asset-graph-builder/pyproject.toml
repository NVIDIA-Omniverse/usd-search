[project]
name = "asset-graph-builder"
dynamic = ["version"]
description = "Kit-worker service for building USD asset dependency graphs"
authors = [
    {name = "Rafal Wytrykus", email = "rwytrykus@nvidia.com"},
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "jinja2>=3.1.6",
    "authlib>=1.7.2",
    "certifi>=2023.7.22",
    "cryptography>=50.0.0",
    "fastapi>=0.125.0",
    "httpx>=0.27.2",
    "orjson>=3.9.0",
    "pillow>=10.2.0",
    "pydantic>=2.10.5",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.22",
    "sentry-sdk>=2.14.0",
    "setuptools>=78.1.1",
    "starlette>=0.50.0",
    "typing_extensions>=4.9.0",
    "urllib3>=2.8.0",
    "usd-core==25.11",  # pxr fallback for the builder; the image layers the ABI-matched packman USD 25.11 stack (stock USD + client + resolver) on top for remote resolution
    "uvicorn>=0.24.0.post1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.1.0"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["graph_builder"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
