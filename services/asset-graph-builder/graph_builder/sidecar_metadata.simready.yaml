# Example / opt-in sidecar-metadata catalog for SimReady-packaged corpora
# (see data/simready_sample/apple_a01_usd_bom for the reference layout, and
# docs/plans/sidecar-package-metadata.md for the design). Not loaded by
# default: point SIDECAR_METADATA_CONFIG_PATH at this file (or a copy) to
# enable it.
#
# Deliberately minimal — this is the smallest catalog that proves the
# mechanism end-to-end against the sample package. `com.nvidia.simready.
# packaging.json` (the package manifest itself), `.metadata/com.nvidia.
# simready.root_usds.json`, `.metadata/com.nvidia.simready.packaging.
# bom.json`, and the package-level conformance report
# (`.metadata/com.nvidia.simready.conformance.*.json` — package-structure
# validation, distinct from the per-asset `validation` block the USD's own
# `SimReady_Metadata` custom-layer data already carries) are intentionally
# not covered here; a deployment that wants them can add sources for them
# using the same `flatten` / `list_membership` / `array_match_flatten`
# extract kinds, no code change required.

package_root_max_depth: 6

sources:
  # Per-asset flat sidecar: <stem>.json next to <stem>.usd, e.g.
  # sm_apple_a01_01.json next to sm_apple_a01_01.usd — author, license,
  # category, qcode, rigid_body_count, asset_extents, mass.
  - name: asset_sidecar
    location: sibling
    filename: "{stem}.json"
    prefix: "sidecar_"
    extract:
      kind: flatten
