# Persistent (normal-resource) RBAC for the long-running refresher Deployment.
# Least privilege: get/patch limited to the single target Secret via resourceNames.
# The pre-install/pre-upgrade seed Job carries its own hook-scoped RBAC (see
# seed-job.yaml) because normal resources do not exist yet when pre-install hooks run.
{{- if include "deepsearch-global.storageApiTokenRefresherEnabled" . }}
{{- $auth := .Values.global.storage_api.authentication }}
{{- $tr := $auth.token_refresher }}
{{- if $tr.rbac.create }}
{{- $name := include "deepsearch-global.storageApiTokenRefresherName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "deepsearch-global.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-api-token-refresher
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $auth.secret_name | quote }}]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "deepsearch-global.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-api-token-refresher
subjects:
- kind: ServiceAccount
  name: {{ include "deepsearch-global.storageApiTokenRefresherServiceAccountName" . }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
