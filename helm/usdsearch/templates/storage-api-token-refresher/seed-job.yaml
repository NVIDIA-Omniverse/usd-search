# Seed hook — closes the startup race by publishing a valid token to the Secret
# BEFORE any service pod (a normal resource) starts. Ordering by hook-weight:
#   -10  placeholder Secret (pre-install only; persists, mounts stay valid)
#    -8  hook-scoped ServiceAccount + Role + RoleBinding (get/patch the Secret)
#    -5  seed Job: vendor sidecar (native init sidecar) writes the token,
#        a one-shot patcher publishes it, then the Job completes.
# The Secret is created here as a pre-install hook (mirroring the VLM api-key
# hook in charts/deepsearch/templates/secrets.yaml), so hooks/secrets.yaml skips
# it for the refresher case to avoid double ownership.
{{- if include "deepsearch-global.storageApiTokenRefresherEnabled" . }}
{{- $auth := .Values.global.storage_api.authentication }}
{{- $tr := $auth.token_refresher }}
{{- $tokenFile := printf "%s/%s" $tr.token_dir $auth.secret_key }}
{{- $seederImage := include "deepsearch-global.usdsearchImage" . }}
{{- $seedName := printf "%s-seed" (include "deepsearch-global.storageApiTokenRefresherName" .) | trunc 63 | trimSuffix "-" }}
{{- /* Same podLabels as the refresher Deployment (the vendor sidecar runs here
       too), with the chart's own labels taking precedence over user values. */}}
{{- $seedPodLabels := merge (dict "app.kubernetes.io/component" "storage-api-token-refresher-seed") (fromYaml (include "deepsearch-global.selectorLabels" .)) $tr.podLabels }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ $auth.secret_name }}
  annotations:
    {{- /* Reuse the shared secret annotations (which carry resource-policy: keep
           so the Secret survives upgrades/uninstall), but pin this one to
           pre-install only at a lower weight than the seed Job (-5) so it exists
           first. pre-install only (vs pre-upgrade) avoids blanking a live token
           on every helm upgrade. */}}
    {{- toYaml (merge (dict "helm.sh/hook" "pre-install" "helm.sh/hook-weight" "-10") .Values.global.secrets.annotations) | nindent 4 }}
  labels:
    {{- include "deepsearch-global.selectorLabels" . | nindent 4 }}
data:
  # Empty placeholders; the seed Job (and the long-running syncer) fill these in.
  # The refreshed-at key must exist up front so the Secret volume projection that
  # mounts it into service pods never blocks pod start.
  {{ $auth.secret_key }}: ""
  {{ include "deepsearch-global.storageApiTokenRefreshedAtKey" . }}: ""
---
{{- if $tr.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $seedName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    {{- with $tr.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "deepsearch-global.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage-api-token-refresher-seed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $seedName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "deepsearch-global.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage-api-token-refresher-seed
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $auth.secret_name | quote }}]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $seedName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-8"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "deepsearch-global.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage-api-token-refresher-seed
subjects:
- kind: ServiceAccount
  name: {{ $seedName }}
roleRef:
  kind: Role
  name: {{ $seedName }}
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $seedName }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    {{- include "deepsearch-global.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-api-token-refresher-seed
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- toYaml $seedPodLabels | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "deepsearch-global.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ $seedName }}
      # Native sidecar (restartPolicy: Always init container, k8s >= 1.28): the
      # vendor keeps running while the seeder patches, then is torn down when the
      # seeder exits, letting the Job complete.
      initContainers:
        {{- include "deepsearch-global.storageApiTokenVendorContainer" (dict "ctx" . "native" true) | nindent 8 }}
      containers:
        - name: token-seeder
          image: {{ $seederImage | quote }}
          imagePullPolicy: {{ include "deepsearch-global.imagePullPolicy" . }}
          command: ["python", "-m", "deepsearch_utils.token_refresher"]
          env:
            - name: MODE
              value: "once"
            - name: TOKEN_FILE
              value: {{ $tokenFile | quote }}
            - name: SECRET_NAME
              value: {{ $auth.secret_name | quote }}
            - name: SECRET_KEY
              value: {{ $auth.secret_key | quote }}
            - name: REFRESHED_AT_KEY
              value: {{ include "deepsearch-global.storageApiTokenRefreshedAtKey" . | quote }}
            - name: SEED_TIMEOUT
              value: {{ $tr.syncer.seed_timeout | quote }}
          volumeMounts:
            - name: storage-api-token-file
              mountPath: {{ $tr.token_dir }}
          {{- with $tr.syncer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: storage-api-token-file
          emptyDir:
            medium: Memory
{{- end }}
