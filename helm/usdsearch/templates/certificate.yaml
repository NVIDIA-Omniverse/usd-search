{{ if and .Values.httpProxy.enabled .Values.api_gateway_deployment.enabled .Values.httpProxy.tls.enabled .Values.httpProxy.tls.certManager.enabled -}}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "deepsearch-global.apiGatewayName" . }}
  labels:
    {{- include "deepsearch-global.labels" . | nindent 4 }}
spec:
  secretName: {{ include "deepsearch-global.tlsSecretName" . }}
  privateKey:
    rotationPolicy: Always
  dnsNames:
    - {{ print .Values.httpProxy.fqdn.host "." .Values.httpProxy.fqdn.domain }}
  usages:
    - digital signature
    - key encipherment
    - server auth
  issuerRef: {{ toYaml .Values.httpProxy.tls.certManager.issuerRef | nindent 4 }}
{{- else -}}
### CertManager's Certificate object is disabled, see .Values.httpProxy.enabled, .Values.httpProxy.tls.enabled, and .Values.httpProxy.tls.certManager.enabled
{{- end }}
