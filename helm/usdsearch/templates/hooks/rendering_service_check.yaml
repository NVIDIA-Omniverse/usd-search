{{  if and .Values.global.checks.rendering_service.enabled .Values.deepsearch.microservices.rendering_service.enabled }}
{{- $releaseName := include "deepsearch-global.releaseName" . -}}
{{- $globalImagePullSecrets := include "deepsearch-global.imagePullSecrets" . -}}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $releaseName }}-rendering-service-check
  labels:
    {{- include "deepsearch-global.labels" . | nindent 4 }}
  annotations:
  {{- toYaml .Values.global.checks.rendering_service.annotations | nindent 4}}
spec:
  ttlSecondsAfterFinished: 3600
  activeDeadlineSeconds: 3600
  backoffLimit: {{ .Values.global.checks.rendering_service.backoff_limit }}
  template:
    spec:
      {{- $globalImagePullSecrets | nindent 6 }}
      restartPolicy: "OnFailure"
      containers:
        - name: connection-check
          {{- $apiImg := .Values.ngsearch.microservices.search_rest_api.image }}
          {{- if $apiImg.name }}
          image: {{ .Values.global.registry }}/{{ $apiImg.name }}:{{ $apiImg.tag | default (include "deepsearch-global.unifiedImageTag" .) }}
          {{- else }}
          image: {{ include "deepsearch-global.usdsearchImage" . }}
          {{- end }}
          command:
          - python
          - -c
          - |
            import json, os, sys, time
            import requests

            url = os.environ["DEEPSEARCH_RENDERER_CONFIG_RENDERING_SERVICE_URL"].rstrip("/") + os.environ["DEEPSEARCH_RENDERER_CONFIG_HEALTH_CHECK_ENDPOINT"]
            headers = json.loads(os.getenv("DEEPSEARCH_RENDERER_CONFIG_EXTRA_HEADERS") or "{}")
            api_key = os.getenv("DEEPSEARCH_RENDERER_CONFIG_API_KEY")
            if api_key:
                headers["Authorization"] = f"Bearer {api_key}"

            # NVCF answers 202 while queued and 502/504 while a cold function starts, so retry until the deadline.
            deadline = time.monotonic() + 900
            while True:
                try:
                    response = requests.get(url, headers=headers, timeout=(10, 300))
                    if response.status_code == 200:
                        print(f"{url} is healthy")
                        sys.exit(0)
                    if response.status_code in (401, 403, 404):
                        sys.exit(f"{url} returned HTTP {response.status_code}: check the API key and service URL")
                    detail = f"HTTP {response.status_code} {response.headers.get('nvcf-status', '')}".strip()
                except requests.RequestException as exc:
                    detail = f"{type(exc).__name__}: {exc}"
                if time.monotonic() >= deadline:
                    sys.exit(f"{url} not healthy within 900s (last: {detail})")
                print(f"{url} not healthy yet ({detail}), retrying in 10s", flush=True)
                time.sleep(10)
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          env:
          {{- if .Values.deepsearch.microservices.rendering_service.settings.rendering_service_url }}
          - name: DEEPSEARCH_RENDERER_CONFIG_RENDERING_SERVICE_URL
            value: {{ .Values.deepsearch.microservices.rendering_service.settings.rendering_service_url }}
          {{- else }}
          - name: DEEPSEARCH_RENDERER_CONFIG_RENDERING_SERVICE_URL
            value: "http://{{ .Release.Name }}-rendering-service.{{ .Release.Namespace }}.svc.cluster.local:8000"
          {{- end }}
          - name: DEEPSEARCH_RENDERER_CONFIG_HEALTH_CHECK_ENDPOINT
            value: {{ .Values.deepsearch.microservices.rendering_service.settings.health_check_endpoint | quote }}
          - name: DEEPSEARCH_RENDERER_CONFIG_EXTRA_HEADERS
            value: {{ .Values.deepsearch.microservices.rendering_service.settings.extra_headers | toJson | quote }}
          {{- if .Values.deepsearch.microservices.rendering_service.authentication.enabled }}
          - name: DEEPSEARCH_RENDERER_CONFIG_API_KEY
            valueFrom:
              secretKeyRef:
                name: {{ .Values.deepsearch.microservices.rendering_service.authentication.api_key_secret_name }}
                key: {{ .Values.deepsearch.microservices.rendering_service.authentication.api_key_secret_field }}
          {{- end }}

{{- end }}
