{{  $fullName := include "deepsearch.fullname" . -}}
{{- $values := .Values -}}
{{- $labels := include "deepsearch.labels" . }}

{{- range $plugin_name, $plugin_config := $values.plugins }}

  {{- if and ( $plugin_config.active ) ( $plugin_config.requires_kit_worker ) ( ($plugin_config.kit_worker).sidecar_metadata_catalog ) }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullName }}-sidecar-metadata-config-{{ $plugin_name | replace "_" "-"  }}
  labels:
    {{- $labels | nindent 4 }}
data:
  sidecar_metadata.yaml: |
    {{- $plugin_config.kit_worker.sidecar_metadata_catalog | toYaml | nindent 4 }}
---

  {{- end }}
{{- end }}
