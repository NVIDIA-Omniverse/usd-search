# Default values for inference.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# # ----------------------------------------------------
# # ------- MAIN parameters to set-up ------------------

################################################################################
## Indexing configuration parameters
################################################################################

# It is possible to override the global exclude_patterns setting for DeepSearch
# service specifically. In order to do so please update the following variable.
# The syntax of this variable should follow the same pattern as in exclude_patterns:
#
# exclude_patterns:
# - <regex 1>
# - <regex 2>
#
# Here regex 1 and regex 2 are some regular expressions that can be found in
# a file path. For example the following value:
#
# exclude_patterns:
# - /.thumbs/
# - .__omni_channel__
#
# will filter out all items that are within ".thumbs" folders and all those
# assets that contain "__omni_channel__" in the file path

# --
# @raw
#
# Vision endpoint configuration settings.
#
# All LLM/VLM access goes through ONE OpenAI-compatible provider (`provider.api_key` -> `USDSEARCH_LLM_API_KEY`, `provider.base_url` -> `USDSEARCH_LLM_BASE_URL`). The stack ships pointed at a default endpoint (NVIDIA Inference Hub); point `base_url` at any OpenAI-API-compatible server to use a different one.
#
vision_endpoint:
  provider:
    api_key_secret_name: "usdsearch-llm-api-key-secret"
    api_key_secret_field: "api-key"
    api_key: ""
    env_prefix: "USDSEARCH_LLM_"
    base_url: "https://inference-api.nvidia.com"
  # Model used for batch metadata generation, on the provider above.
  # Default from the 2026-08 metadata bake-off (see docs/models-and-config.md).
  metadata_model: "azure/openai/gpt-5.6-sol"
  # Extra OpenAI request-body fields merged into every metadata-generation call,
  # as a JSON object (-> USDSEARCH_VISION_METADATA_EXTRA_BODY on the plugin
  # worker). Empty by default; the env is only emitted when set. Same purpose as
  # the validation/parsing extra_body — e.g. disable thinking on a vLLM-served
  # Qwen: `{"chat_template_kwargs": {"enable_thinking": false}}`.
  metadata_extra_body: {}

  # Request-size limits for metadata generation. These values are global by
  # design: one monitor-crawler computes the cache identity for every metadata
  # worker, so all processes must resolve identical settings.
  input:
    # Maximum number of views sent in one VLM request.
    max_images: 16
    # Maximum pixel length of either image edge (shrink-only).
    max_px: 512
    # Maximum total encoded image payload per request (8 MiB).
    max_request_bytes: 8388608
  # Optional output-contract revision. Empty (default) = legacy asset-only cache
  # identity: upgrading never reprocesses unchanged assets. Any non-empty value
  # opts in: the revision and the limits above join the cache identity, and
  # changing any of them (bump the revision after a model/prompt/schema change)
  # makes unchanged assets eligible for reprocessing.
  metadata_revision: ""

  #
  # Configuration of metadata fields extracted by the VLM-based auto-captioning system
  #
  metadata_fields:

  - name: caption
    description: >
      A concise, specific title (5-12 words) naming the object precisely.
      Format: "[distinguishing adjectives] [specific object name]".
      Examples: "Counterbalance warehouse forklift", "Galvanized steel pallet rack",
      "Articulated 6-axis industrial robot arm", "Weathered red shipping container",
      "Ergonomic mesh office chair", "Stainless commercial kitchen prep table".
    type: str

  - name: object_type
    description: >
      The single most specific common noun for the object (lowercase), e.g.
      "forklift", "pallet rack", "conveyor belt", "office chair", "fire extinguisher",
      "traffic cone", "robot gripper", "cardboard box", "transformer", "hand drill".
      Prefer the precise term over a generic one ("sectional sofa", not "furniture").
    type: str

  # Free-text `category` (no allowed_values list) gives poor results — the model
  # needs a closed vocabulary to pick from. DISABLED here; re-enable per
  # deployment via the allowed_values list below (uncomment the whole field), or
  # by overriding vision_endpoint.metadata_fields in helm values. The list is
  # corpus-derived for the Isaac/SimReady corpus (see the re-derivation runbook
  # above); off-list values coerce to null when enabled. Value hints: primitive_shape
  # = bare geometric primitive (cube, cylinder, plane); part = generic mechanical
  # component that is not a fastener (rod, peg, spacer, bracket); hardware =
  # fasteners (nut, bolt, screw, washer); prop = recognizable everyday object
  # used as set dressing.
  # - name: category
  #   description: >
  #     The single best top-level category as a short lowercase noun, e.g.
  #     furniture, vehicle, robot, signage, container; use null when no clear
  #     category applies — a wrong category is worse than none.
  #   type: str
  #   nullable: true
  #   allowed_values: [furniture, appliance, electronics, lighting, vehicle,
  #     robot, machinery, tool, hardware, part, primitive_shape, equipment,
  #     medical_equipment, material_handling, container, packaging, structure,
  #     fixture, signage, safety_equipment, sensor, instrument, weapon, clothing,
  #     food, nature, terrain, character, decoration, prop]

  - name: queries
    description: >
      Short search phrases a person would actually type into a search box to find
      this asset — aim for 5-10 (at least 3 required; even a bare primitive supports
      shape/color phrases like "gray cube"), lowercase, ordered most generic first.
      Start with the plain
      object name, then common synonyms, then the few most distinctive qualified
      phrasings: "forklift", "fork truck", "warehouse forklift", "yellow
      counterbalance forklift". Each phrase 1-4 words, written the way users
      search — no full sentences, no catalog or engineering jargon, and no generic
      filler ("3d model", "asset", "object", "prop"). These phrases are matched
      directly by keyword search.
    type: list[str]
    min_items: 3
    max_items: 10

  - name: tags
    description: >
      Lowercase keywords a user might actually search, ordered most→least relevant —
      aim for 8-15 (at least 3 required). Cover: the object name + synonyms
      (forklift, lift truck, fork truck); specific type/variant (counterbalance,
      reach truck, pallet jack); clearly visible parts and part-level features
      (forks, mast, overhead guard, cab, hydraulics); brand or model text ONLY if
      clearly legible; and domain/industry terms (warehouse, logistics, material
      handling). Be thorough, include synonyms, and use the words users type — not
      catalog or engineering jargon. Never pad with generic filler ("3d model",
      "asset", "object", "mesh", "prop") or attributes you cannot clearly see; for
      bare primitives and abstract assets, shape and color terms (cube, box, sphere,
      gray) count as valid tags.
    type: list[str]
    min_items: 3
    max_items: 15

  - name: environment
    description: >
      Typical real-world settings where this asset is found (lowercase, 0-5), e.g.
      "warehouse", "factory floor", "loading dock", "office", "retail store",
      "hospital", "kitchen", "construction site", "outdoor", "urban street",
      "residential interior", "laboratory".
    type: list[str]
    max_items: 5

  - name: colors
    description: >
      Dominant colors, most→least prominent (max 5). Simple searchable names:
      red, orange, yellow, green, blue, purple, pink, brown, black, white, gray,
      beige, gold, silver. Add a modifier only when distinctive (dark_gray, safety_yellow).
    type: list[str]
    max_items: 5

  - name: materials
    description: >
      Apparent materials, primary→secondary (max 5). Common terms: steel, aluminum,
      metal, wood, plastic, glass, fabric, leather, rubber, concrete, stone, ceramic,
      cardboard, paper, foam, carbon_fiber, chrome, brass, composite. Only materials
      you can clearly identify at this resolution — when unsure between specific
      metals, say "metal".
    type: list[str]
    max_items: 5

  - name: style
    description: >
      The dominant REPRESENTATION style — how the asset is rendered/authored, not
      its design aesthetic (aesthetic terms like "industrial", "modern", "vintage"
      belong in tags). realistic covers photorealistic. Choose exactly ONE from
      the allowed list; use null if truly undeterminable.
    type: str
    nullable: true
    allowed_values: [realistic, stylized, low_poly, cad, scanned]

  - name: scale
    description: >
      Approximate real-world size class. Choose exactly ONE:
      tiny (fits in a hand), small (desktop), medium (human-scale / furniture),
      large (vehicle / machine), huge (building / structure); use null if the
      size cannot be judged.
    type: str
    nullable: true
    allowed_values: [tiny, small, medium, large, huge]

  - name: state
    description: >
      Apparent condition. Choose exactly ONE — new (clean / like-new), used
      (visibly in service), worn (heavy wear, weathering, or dirt), damaged
      (broken or missing parts); use null if condition cannot be judged.
    type: str
    nullable: true
    allowed_values: [new, used, worn, damaged]

  - name: physical_attributes
    description: >
      Functional / mechanical traits relevant to simulation and robotics
      (lowercase, 0-6), only from the allowed list. Rigid is the default —
      tag only what deviates from a plain static rigid object, and only traits
      clearly evident in the views.
    type: list[str]
    max_items: 6
    allowed_values: [articulated, has_moving_parts, wheeled, deformable,
      stackable, graspable, openable, foldable, transparent, emissive,
      reflective, mounted, modular]

  - name: visible_text
    description: >
      Text on the asset that is CLEARLY LEGIBLE at the provided resolution
      (verbatim, 0-6 short strings): labels, brand names, model numbers, signage,
      warnings. If you cannot read every character of a string, omit it entirely —
      never reconstruct partial text or infer branding from a logo shape or color
      scheme. Empty list if none. Legible text is a strong, unique search signal
      (e.g. brand, "EXIT", load ratings, hazard labels); invented text is the
      worst kind of index pollution.
    type: list[str]
    max_items: 6

  image_prompt: |
    You are an indexing engine for USD Search, a 3D-asset search engine used across
    robotics & simulation, synthetic data generation, industrial / warehouse /
    logistics, autonomous driving, digital twins, and games & film.

    You are shown one or more rendered views of a SINGLE 3D asset. Nobody reads your
    output: every word you emit is either a keyword-search term or a filter value.
    Optimize purely for retrieval — capture EVERY distinctive term a real user might
    type to find exactly this asset. Imagine a robotics engineer, an SDG pipeline, a
    warehouse digital-twin team, and a game artist all searching for it, and cover
    the terms each of them would use. Distinctive breadth, zero filler.

    ## How to analyze
    1. The images are multiple views of the same asset. Aggregate evidence across ALL
       views: a part occluded in one view may be clear in another; text may be legible
       in only one view. Report what at least one view clearly shows; reconcile
       contradictions in favor of the clearer view.
    2. Identify the object as specifically as possible (not "vehicle" but "counterbalance forklift").
    3. Note its clearly visible parts, function, materials, dominant colors,
       real-world scale, condition, and mechanical traits.
    4. Transcribe visible text ONLY if every character is clearly legible in some view.
    5. Brainstorm the keywords, synonyms, part names, and domain terms each kind of
       user would type to find it.

    ## Output format (JSON object with exactly these fields)
    {metadata_types}

    ## Field definitions
    {metadata_definitions}

    ## Rules
    - Output ONLY a valid JSON object with every field above — no prose, no markdown.
    - The renders are low resolution. Describe only what you can clearly resolve:
      prefer omission over inference. Never invent brands, text, part details, or
      function; never reconstruct partially legible text or infer branding from a
      logo shape or color scheme.
    - When a field can't be determined: use null for category, style, scale, and
      state (never force a wrong value); "unknown" for object_type; and an empty
      list `[]` for environment, colors, materials, physical_attributes, and
      visible_text. Do not guess. caption, queries, and tags must ALWAYS describe
      what IS visible, at whatever specificity the renders support (for a bare
      primitive: "gray box-shaped object", tags like cube, box, gray).
    - Every list is ordered most→least relevant.
    - Be specific over generic. Never emit filler that matches almost every asset:
      "3d model", "asset", "object", "mesh", "render", or near-universal phrases.
    - Use lowercase for queries, tags, object_type, environment, colors, materials,
      physical_attributes (captions and verbatim visible_text keep natural casing).
    - Fields with allowed lists (style, scale, state, physical_attributes items —
      and category where the deployment defines a list) take values ONLY from
      those lists, verbatim; null beats a wrong pick.
    - Queries and tags are the most important fields: phrase them exactly the way
      real users search — thorough, with synonyms, part names, and domain terms.
thumbnail_settings:
  relative_location: ".thumbs"
  suffixes:
    - ""
    - ".auto"
  filepath_patterns:

microservices:
  # set-up monitor service that scans omniverse in the background
  monitor:
    # By default the monitor / info-endpoint / plugin-worker pods all run the
    # unified `usdsearch` image (see `global.image.usdsearch`). Override
    # `name`/`tag` here to pin a different image for these pods only.
    image:
      name: ""
      tag: ""

    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        # NOTE: here 2 CPUs are: 1 for the main python loop and the other one for prometheus metrics exporter
        cpu: 1
        # NOTE: this limit is set quite large by default, adjust it based on the
        #  Nucleus Server size the memory usage of the service starts to grow,
        #  when updates from the Nucleus server arrive faster than they are
        #  being processed
        memory: 2Gi

    # Enable liveness check before container start-up. This liveness checks verifies that
    # all resources that microservice depends on a ready before initialization. These
    # resources include:
    #  * Redis
    enableLivenessChecks: true

    # Additional pod annotations for the monitor service
    extraPodAnnotations: {}

    # Number of assets the monitor-crawler consumes and processes concurrently
    # per loop iteration (maps to the PROCESSING_BATCH_SIZE env var). The
    # default of 1 processes assets serially; increasing it overlaps the
    # per-asset Redis / storage round-trip latency for higher throughput on
    # large servers. Tune alongside the `resources` limits above.
    processing_batch_size: 1

  monitor_cron:
    replicas: 1

  monitor_crawler_cron:
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        # NOTE: here 2 CPUs are: 1 for the main python loop and the other one for prometheus metrics exporter
        cpu: 1
        # NOTE: this limit is set quite large by default, adjust it based on the
        #  Nucleus Server size the memory usage of the service starts to grow,
        #  when updates from the Nucleus server arrive faster than they are
        #  being processed
        memory: 2Gi

    # Enable liveness check before container start-up. This liveness checks verifies that
    # all resources that microservice depends on a ready before initialization. These
    # resources include:
    #  * Redis
    #  * NGSearch storage service
    enableLivenessChecks: true

  # configuration for the rendering service
  rendering_service:
    enabled: false
    authentication:
      enabled: false
      api_key:
      api_key_secret_name: rendering-service-api-key-secret
      api_key_secret_field: api-key
    settings:
      rendering_service_url:
      endpoint: /usdsearch/render
      health_check_endpoint: /health
      force_render: True
      enable_caching: False
      extra_headers:
        NVCF-POLL-SECONDS: "600"
      maximum_parallel_requests: 10

  # configuration for the k8s renderer Job
  k8s_renderer:
    enabled: true
    # By default the renderer Job runs the unified `rendering-job` (Kit) image
    # (see `global.image.rendering_job`). Override here to pin a different
    # image for the renderer only.
    image:
      name: ""
      tag: ""

    # verify k8s ssl certificates
    verify_k8s_ssl_cert: true

    # additional environment variables
    env:

    # It is possible to increase the number of parallel Kit workers that would process
    # assets on a single GPU
    n_parallel_kit_workers: 1

    # It is possible to specify the number of assets that are processed by a Kit worker,
    # before it is being re-created.
    #
    # Setting this parameter to a negative value will make all items to be processed by
    # a single Kit worker
    n_assets_per_worker: 1

    # -- (bool)
    # @raw
    #
    # When set to ``True`` and the USD asset being rendered has a default prim defined, the asset is referenced into the default scene rather than opened as a sublayer. If the USD asset does not have a default prim, the system falls back to loading the entire USD scene as a sublayer.
    load_asset_as_reference: true

    # -- (bool)
    # @raw
    #
    # When set to ``True`` (default), each asset is auto-framed like the former Kit renderer: the camera is re-centered on the asset's silhouette (top and side views) and zoomed in to fill about 75% of the view. Set to ``False`` to frame by the asset's 3D bounding box only. Requests can still opt out with ``render_settings.adjust_camera_multiplier``.
    adjust_framing: true

    # ovrtx's compiled-shader (UJITSO) and USD/asset resolver caches, mounted from the
    # SAME `cache` persistence volume (see top-level `persistence`) via two subPaths
    # ("shaders" and "usd") in the Job template — they share one sizeLimit, not one
    # each. Without this, both caches fall back to ephemeral paths inside the
    # container and are recreated from scratch on every rendering Job pod.
    usd_cache:
      # Caps the resolver cache's on-disk footprint (bytes). The shader cache has no
      # equivalent cap and shares this same volume, so budget the two together against
      # `persistence`'s size rather than sizing this alone: at the 10Gi
      # persistence.emptyDir default, 4Gi here (cleanup trips around 3.2Gi, given
      # cleanup_threshold below) leaves ~6Gi of headroom for shaders before the
      # kubelet evicts the pod for exceeding the volume's sizeLimit. Raise both
      # together if either cache needs more room.
      max_size_bytes: "4294967296"  # 4Gi, under the 10Gi persistence.emptyDir default
      # Fraction of max_size_bytes that triggers cache eviction.
      cleanup_threshold: 0.8
      # How often (seconds) the resolver checks whether cleanup_threshold is exceeded.
      garbage_collection_interval_seconds: 300

    # amount of time pod is kept after completion
    ttlSecondsAfterFinished: 3600
    # deadline for execution (default 2 hours)
    activeDeadlineSeconds: 7200

    render_job_pod_annotations: {}

    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"

    resources: {}

    persistence:
      initVolumePermissions: false

    # verify that storage backend is accessible by the rendering job
    # This should prevent Kit instances from being created in case storage
    # backend is inaccessible
    checkStorageBackendAccess: true

    # Maximum number of parallel rendering jobs that are created. If this
    # parameter is unset - then no limit on the number of parallel Kit jobs is
    # applied and all available resources will be used.
    maxRenderingJobsCount:

    securityContext:
      fsGroup: 1000
      runAsUser: 1000
      runAsNonRoot: true

  plugin_worker:
    sentry_dsn: ""
    settings:
      # Number of concurrent workers that are getting new plugin jobs from cache
      # and sending them for processing
      n_concurrent_queue_workers: 1

    rendering_settings:
      # rendering type can be either k8s or rendering_service
      renderer_type: k8s
      # Number of samples packages in a batch before the rendering request
      # is sent for rendering:
      #   > setting this parameter too small may result in time being lost on
      #     job initialization
      #   > setting this parameter too big may result in too many rendering
      #     requests sent to a single job, while other jobs remain idle
      client_batch_size: 16

      # Maximum number of seconds to wait before sending a batch of rendering
      # requests to a single job.
      client_batch_timeout: 30

      # Maximum number of pending rendering jobs that are allowed before a new
      # one is created. If this parameter is 0 or below, the setting is
      # ignored (unlimited).
      #
      # NOTE: 0 is *not* a stricter throttle than a positive number - it is
      # treated as disabled. Dispatching a rendering job always makes the
      # pending count >= 1, so a literal 0 would never again be satisfied
      # through normal operation, deadlocking the worker after its very first
      # dispatch (see packages/deepsearch-utils/deepsearch_utils/farm/_client.py
      # and services/deepsearch-monitor/monitor/src/monitor_worker.py, which
      # both treat pending_job_limit <= 0 as disabled for this reason).
      #
      # Defaults to 2, so a worker can have at most one extra rendering job
      # queued up behind the one already in flight - enough to keep the
      # renderer fed without flooding the cluster with pending jobs.
      pending_job_limit: 2

      # Number of seconds to wait when to retry when rendering service is busy
      #
      # **NOTE**: only applicable when ``rendering_type`` is ``rendering_service``
      retry_timeout_on_busy: 10

      # Maximum size, in bytes, of a single WebSocket frame the farm result
      # receiver (``FarmWebsocketServer``) will accept from a rendering job.
      # Exported as ``FARM_CLIENT_WS_MAX_SIZE`` on rendering-based plugin
      # workers.
      #
      # Defaults to 1 GiB (``1073741824``) to match the code default. This bounds
      # the memory a single oversized — or maliciously zlib-bomb-compressed —
      # render payload can allocate before it is rejected, closing an
      # unauthenticated-WebSocket OOM vector. A second guard caps the
      # *decompressed* size separately (``SEARCH_UTILS_MAX_DECOMPRESSED_BYTES``).
      #
      # Raise this only if legitimate render payloads (high-resolution frames,
      # large point clouds) can exceed 1 GiB on the wire; lowering it rejects
      # any frame above the limit.
      ws_max_size: 1073741824

    # -- (map)
    # @raw
    #
    # Dictionary of worker configurations, keyed by worker name. Each entry defines a dedicated worker deployment that processes plugin jobs. At least one entry is required for plugin workers to be scheduled.
    #
    # Each worker supports the following optional fields:
    #
    # - ``group`` *(string)* — group name assigned to this worker. Jobs submitted with a matching group name will only be routed to workers in that group.
    # - ``job_type`` *(list of strings)* — list of job item types this worker will process. If omitted, the worker processes all job types.
    # - ``pending_job_limit`` *(int)* — maximum number of pending rendering jobs allowed before a new rendering job is created for this worker. Overrides ``rendering_settings.pending_job_limit`` for this worker.
    # - ``retry_timeout_on_busy`` *(int)* — seconds to wait before retrying when the rendering service is busy. Overrides ``rendering_settings.retry_timeout_on_busy`` for this worker.
    #
    # @notationType -- yaml
    worker_config:
      bg: {}
      priority:
        group: priority-group
        pending_job_limit: 5
        retry_timeout_on_busy: 2
        job_type:
        - priority

    service:
      port: 8765
      schema: ws
      type: ClusterIP
      # ------------------------------------------
      #  NodePort configuration example
      # ------------------------------------------
      # type: nodeport
      # nodeport: 30507
      # ------------------------------------------
      #  Ingress service configuration example
      # ------------------------------------------
      # type: ingress
      # host: <my ingress host name>
      # path: "/"
      # ------------------------------------------
      #  Load Balancer service configuration example
      #  IMPORTANT: Selected Load Balancer type must support WebSockets.
      #    For example in the case of an AWS deployment "NLB" loadbalancer
      #    type would be a suitable option, while "ELB" loadbalancer type
      #    will not work.
      # ------------------------------------------
      #     type: loadbalancer
      # ------------------------------------------
      #  Additional service annotations
      #    * could be useful when setting type loadbalancer
      #    * when non provided - default service annotations defined in ``service.annotations`` will be used
      # ------------------------------------------
      #       annotations:
      #         service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      # ------------------------------------------
      # It is possible to provide an external endpoint URL with the provided values.
      # This could be useful if there is an alias pointing to the internal WS URL.
      # ------------------------------------------
      endpoint_override:
        enabled: false
        # host: ""
        # port: ""
        # schema: "ws"

    resources:
      requests:
        cpu: 0.5
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi

    # Configuration of the temporary directory for the service. By default it is
    # set to use Memory medium
    tmpDir:
      emptyDir: {}

    # Enable liveness check before container start-up. This liveness checks verifies that
    # all resources that microservice depends on a ready before initialization. These
    # resources include:
    #  * Redis
    #  * embedding inference service
    enableLivenessChecks: true

    # default resources for liveness check containers
    liveness_checks:
      resources:
        requests:
          cpu: 200m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 128Mi

    # metrics
    metrics:
      port: 8011

  # Service that writes processed data to the Search backend
  omni_writer:
    # number of replicas
    replicas: 1
    # resources for a single replica
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1
        memory: 2Gi
    settings:
      n_concurrent_queue_workers: 2
    hpa:
      enabled: false
      minReplicas: 1
      maxReplicas: 5

    # Enable liveness check before container start-up. This liveness checks verifies that
    # all resources that microservice depends on a ready before initialization. These
    # resources include:
    #  * Redis
    #  * NGSearch storage service
    enableLivenessChecks: true

  info_endpoint:
    replicas: 1
    resources:
      requests:
        cpu: 0.5
        memory: 2Gi
      limits:
        # NOTE: here 2 CPUs are: 1 for the main python loop and the other one for prometheus metrics exporter
        cpu: 1
        # NOTE: this limit is set quite large by default, adjust it based on the
        #  Nucleus Server size the memory usage of the service starts to grow,
        #  when updates from the Nucleus server arrive faster than they are
        #  being processed
        memory: 4Gi

    service:
      type: ClusterIP
# ------------------------------------------
#  NodePort configuration example
# ------------------------------------------
      # type: nodeport
      # nodeport: 30550
# ------------------------------------------
#  Ingress service configuration example
# ------------------------------------------
      # type: ingress
      # host: <my ingress host name>
      # path: "/"

    # Enable liveness check before container start-up. This liveness checks verifies that
    # all resources that microservice depends on a ready before initialization. These
    # resources include:
    #  * Redis
    enableLivenessChecks: true

  # service for inference functionality
  embedding:
    replicas: 1
    deployment_strategy: RollingUpdate
    # By default the embedding pod runs the unified `siglip2-triton` image
    # (see `global.image.siglip2_triton`). Override here to pin a different
    # image for the embedding service only.
    image:
      name: ""
      tag: ""
    service:
      inference:
        type: ClusterIP

    triton_server:
      livenessProbe:
        httpGet:
          path: /v2/health/live
      readinessProbe:
        httpGet:
          path: /v2/health/ready
      presistence:
        enabled: False

    # affinity and tolerations specifically for the embedding service
    affinity: {}
    tolerations: []

    # Optional RuntimeClass for the embedding pod. Empty (default) leaves the
    # field unset so the cluster's default RuntimeClass applies. Set it (e.g.
    # "nvidia") to force a specific GPU RuntimeClass when multiple are defined
    # (see `kubectl get runtimeclass`).
    runtimeClassName: ""

    # ------------------------------------------
    #  Additional service annotations
    #    * could be useful when setting type loadbalancer
    #    * when non provided - default service annotations defined in ``service.annotations`` will be used
    # ------------------------------------------
    #         annotations:
    #           service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

    # Note: The embedding service requires ~3.5GB of RAM per worker. Set this parameter
    # according to available resources and expected load.

    default_workers_per_model: 2
    resources:
      requests:
        cpu: 2
        memory: 7Gi
        nvidia.com/gpu: 1
      limits:
        cpu: 4
        memory: 15Gi
        nvidia.com/gpu: 1

    # Configuration of the temporary directory for the service. By default it is
    # set to use Memory medium
    tmpDir:
      emptyDir:
        medium: Memory
        sizeLimit: 256Mi

    # if you have a GPU available on the Kubernetes cluster and you would like
    # embedding service to use it uncomment the following
    #
    #   requests: {nvidia.com/gpu: 1},
    #   limits: {nvidia.com/gpu: 1}
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      averageCPUUtilization: 50

    # Pod security context configuration for the embedding service
    securityContext:
      # fsGroup: 1001
      runAsUser: 1001
      runAsNonRoot: true
      readOnlyRootFilesystem: true

  # metrics ports for the DeepSearch deployment
  metrics:
    omni_writer: 8013
    monitor_crawler: 8014

#
# Configuration of Redis the following Redis streams:
#   * Farm Job stream - stores plugin processing requests that require rendering
#   * Non Farm Job stream - stores plugin processing requests that do not require rendering
#   * Results stream - stores plugin processing results
#
# The parameters below regulate the number of retries for a given asset and
# timeouts of when the processing for the asset is considered to be failed and
# it needs to be re-claimed from the stream by a different worker.
#
cache_settings:
  # How long an item may stay unacknowledged before it is assumed to belong to a
  # worker that died and is put back at the end of its stream. A worker that is
  # alive when processing fails re-adds the item immediately instead (see
  # ``requeue_failed_items``), so these values only need to exceed the longest a
  # healthy worker can legitimately hold one item - below that, a slow item is
  # processed twice. They matter for more than retries: an item stays pending until
  # it is requeued, and the oldest pending item is where trimming of the whole
  # stream stops.
  farm_job_autoclaim_min_idle_time: "10800000"  # 3 hours (in milliseconds)
  # 90 minutes: covers the slowest non-render plugin (asset-graph generation allows
  # 30 min to build a graph and 30 min to store it).
  non_farm_job_autoclaim_min_idle_time: "5400000" # 90 minutes (in milliseconds)
  results_autoclaim_min_idle_time: "300000" # 5 minutes (in milliseconds)
  # Attempts allowed for an item before it is dropped from its stream. This is one
  # budget for both ways an item can fail - the worker raised, or the worker died
  # holding it - because the attempt count is carried on the queued item itself. A
  # dropped job is recorded as `failed_retries_exhausted`; a dropped result is
  # produced again by the next crawl, since the asset's cached hash is only updated
  # once its result has been written.
  #
  # Set either to "-1" to retry forever and never drop anything. That keeps work
  # that is expensive to recreate - a result already carries finished inference -
  # but an item that can never succeed then cycles through its stream indefinitely,
  # so watch `omnideepsearch_stream_items_requeued_total` when using it.
  job_autoclaim_n_retries: "5"
  results_autoclaim_n_retries: "5"
  # If "True" - an item whose processing raised is acknowledged and re-added to the
  # back of its stream straight away. Set to "False" to leave it pending instead, in
  # which case it is requeued only once it has been idle for the timeout above.
  requeue_failed_items: "True"

imagePullPolicy: IfNotPresent
nameOverride: ""
fullnameOverride: ""

# override omni config
OVERRIDE_CONFIG: false

# create omniverse service user
CREATE_SERVICE_USER: false

# environment variables
env:
  # You can provide additional environment variables as follows
  #  - name: 'VARIABLE NAME'
  #    value: 'VARIABLE VALUE'

################################################################################
## Plugin configuration
################################################################################

# USD Search API service is built as a collection of plugins, each of which does a
# specific job. These plugins can be optionally activated and deactivated by
# modifying the following configuration and setting the ``active`` parameter of
# specific plugins to ``false``:

plugins:

    # -- (map)
    # @raw
    #
    # Construction of a scene graph for a given USD asset
    #
    # @notationType -- yaml
    asset_graph_generation:
      preview_name: ags
      type: asset_graph_generation
      active: True
      requires_embedding_service: False
      requires_ags_service: True
      requires_rendering: False
      vision_endpoint: {}

      # resource overrides
      resources:
        requests:
          cpu: 1
          memory: 3Gi
        limits:
          cpu: 1
          memory: 3Gi

      # Graph construction runs Kit in a `kit-worker` sidecar next to the plugin
      # worker. The chart adds that container whenever `requires_kit_worker` is
      # set; everything about it is configured under `kit_worker` below.
      #
      # It is deliberately *not* an entry in `sidecar_containers`: Helm merges
      # maps but replaces lists wholesale, so a list entry cannot be tuned one
      # field at a time — overriding just the memory limit would drop the image
      # and command with it. As a map, `--set ...kit_worker.<anything>` works.
      requires_kit_worker: True

      kit_worker:

        # By default the sidecar runs the kitless graph-builder image
        # (see `global.image.graph_builder`), a plain-Python USD worker with no
        # Kit or GPU. Set `name`/`tag` to pin a different image.
        image:
          name: ""
          tag: ""

        command:
          - sh
          - -c
          - "python -m uvicorn graph_builder.service:app --host=0.0.0.0"

        securityContext:
          # fsGroup: 1000
          runAsUser: 1000
          runAsNonRoot: true
          # readOnlyRootFilesystem: true

        # Container resources for the sidecar. OOM-kills of this container (exit
        # 137) are the most common asset-graph failure, and the ceiling scales
        # with `n_concurrent_queue_workers` — that value becomes
        # `N_PARALLEL_PROCESSES`, i.e. how many Kit processes share this one
        # container. Raise concurrency and memory together, or not at all.
        resources:
          requests:
            cpu: 4
            memory: 10Gi
          limits:
            cpu: 8
            memory: 10Gi

        # Soft memory watchdog for the Kit subprocess, in MB. Set it *below*
        # `resources.limits.memory` (~80-90% is a reasonable starting point): the
        # builder then kills Kit itself and reports `graph_construction_oom` for
        # that asset, instead of the kernel killing the container and taking the
        # in-flight request's connection with it. Leave unset to keep the kernel
        # solely in charge (previous behavior).
        memory_limit_mb:

        # Wall-clock limit for a single graph build, in seconds. Applied to the
        # Kit subprocess; the plugin's HTTP client gets this plus
        # `client_timeout_margin` so the builder's own timeout is what surfaces,
        # with the reason attached, rather than an opaque client-side timeout.
        timeout_seconds: 1800
        client_timeout_margin: 120

        # On-disk Kit asset cache (downloaded USD + textures, reused across
        # builds). Without a volume this lives in the container's writable layer:
        # lost on every restart and not accounted against ephemeral-storage.
        cache:
          enabled: true
          mount_path: /cache
          # "" = node disk, "Memory" = tmpfs (counts against the memory limit).
          medium: ""
          size_limit: 20Gi

        # /dev/shm for the sidecar. The container default is 64Mi, which is small
        # for USD/Kit. "" disables the mount.
        shm_size: 1Gi

        # Extra environment variables, appended after the chart-set ones (so a
        # name repeated here wins).
        env: []

        # Sidecar / package metadata catalog (opt-in) — the graph builder can pick
        # up metadata that ships next to a USD file (a per-asset sidecar, or a
        # package-level manifest) and merge it into the asset's properties. See
        # docs/plans/sidecar-package-metadata.md and
        # services/asset-graph-builder/graph_builder/sidecar_metadata.py for the
        # design and the merge/precedence rules.
        #
        # Empty by default (`{}`) — a no-op, matching `SIDECAR_METADATA_CONFIG_PATH`
        # being unset. Set this to a full sidecar-metadata YAML document — the same
        # shape as `graph_builder/sidecar_metadata.simready.yaml` in the
        # asset-graph-builder image, e.g. `package_root_max_depth` + `sources: [...]`
        # — and the chart renders it into a ConfigMap, mounts it into the
        # `kit-worker` sidecar, and points `SIDECAR_METADATA_CONFIG_PATH` at it. No
        # custom image required.
        sidecar_metadata_catalog: {}

      # Generic extension point for *additional* sidecars, if a deployment needs
      # any. The kit-worker is not listed here — see `kit_worker` above.
      sidecar_containers: []

    # -- (map)
    # @raw
    #
    # Generation of thumbnails for USD assets on Nucleus server based on the
    # rendered views received from the Omniverse Farm
    #
    # @notationType -- yaml
    thumbnail_generation:
      preview_name: thumb-gen
      type: thumbnail_generation
      active: True
      requires_embedding_service: False
      n_concurrent_queue_workers: 256
      requires_rendering: True
      useRenderingServiceAccount: True
      requires_vision_metadata: False
      extra_env:
        REMOVE_EXISTING_THUMBNAILS: "true"
        SKIP_OMNI_WRITES: "false"
      vision_endpoint: {}

    # -- (map)
    # @raw
    #
    # Rendering USD assets from multiple views and
    # extraction of CLIP embeddings from each view to better characterize
    # the asset
    #
    # @notationType -- yaml
    rendering_to_embedding:
      preview_name: render-emb
      type: rendering_to_embedding
      active: True
      requires_embedding_service: True
      n_concurrent_queue_workers: 256
      requires_rendering: True
      useRenderingServiceAccount: True
      requires_vision_metadata: False
      vision_endpoint: {}

    # -- (map)
    # @raw
    #
    # Extraction of CLIP embeddings from thumbnails of assets that are found on the Storage backend. GIF thumbnails are also supported — GIF files are split into multiple frames by sampling every Nth frame (default: every frame), capped at a maximum number of frames (default: ``512``), configurable via the optional ``gif_sampling_mode`` (``fixed`` = every Nth frame, or ``uniform`` = ``gif_max_frames`` frames spread evenly across the GIF), ``gif_frame_sample_frequency``, and ``gif_max_frames`` parameters. Please refer to the [Thumbnail indexing settings](#thumbnail-indexing-settings) section for more information on how to configure the service to read GIF thumbnails.
    #
    # @notationType -- yaml
    thumbnail_to_embedding:
      preview_name: thumb-emb
      type: thumbnail_to_embedding
      active: True
      requires_thumbnail_settings: True
      requires_embedding_service: True
      requires_rendering: False
      requires_vision_metadata: False
      n_concurrent_queue_workers: 5
      vision_endpoint: {}
      # gif_sampling_mode: fixed  # "fixed" (every Nth frame) or "uniform" (gif_max_frames frames spread evenly)
      # gif_frame_sample_frequency: 1
      # gif_max_frames: 512

    # -- (map)
    # @raw
    #
    # Extraction of CLIP embeddings from images. The following image types are
    # supported:
    #  * all the formats supported by PIL library
    #  * EXR
    #  * GIF
    #
    # __NOTE__: GIF files are split into multiple frames by sampling every Nth frame (default: every frame), capped at a maximum number of frames (default: ``512``). Sampling can be customized via the optional ``gif_sampling_mode`` (``fixed`` = every Nth frame, or ``uniform`` = ``gif_max_frames`` frames spread evenly across the GIF), ``gif_frame_sample_frequency``, and ``gif_max_frames`` parameters.
    #
    # @notationType -- yaml
    image_to_embedding:
      preview_name: img-emb
      type: image_to_embedding
      active: True
      requires_embedding_service: True
      requires_rendering: False
      requires_vision_metadata: False
      vision_endpoint: {}
      # gif_sampling_mode: fixed  # "fixed" (every Nth frame) or "uniform" (gif_max_frames frames spread evenly)
      # gif_frame_sample_frequency: 1
      # gif_max_frames: 512
      # resource overrides
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: 1
          memory: 4Gi

    # -- (map)
    # @raw
    #
    # Generation of Vision metadata from Images. The following image types are
    # supported:
    #  * all the formats supported by PIL library
    #  * EXR
    #  * GIF
    #
    # __NOTE__: GIF files are split into multiple frames by sampling every Nth frame (default: every frame), capped at a maximum number of frames (default: ``512``). Sampling can be customized via the optional ``gif_sampling_mode`` (``fixed`` = every Nth frame, or ``uniform`` = ``gif_max_frames`` frames spread evenly across the GIF), ``gif_frame_sample_frequency``, and ``gif_max_frames`` parameters.
    #
    # @notationType -- yaml
    image_to_vision_metadata:
      preview_name: img-vis-meta
      type: image_to_vision_metadata
      active: False
      requires_embedding_service: False
      requires_rendering: False
      requires_vision_metadata: True
      vision_endpoint: {}
      # gif_sampling_mode: fixed  # "fixed" (every Nth frame) or "uniform" (gif_max_frames frames spread evenly)
      # gif_frame_sample_frequency: 1
      # gif_max_frames: 512

    # -- (map)
    # @raw
    #
    # Generation of Vision metadata from Renderings.
    #
    # @notationType -- yaml
    rendering_to_vision_metadata:
      preview_name: render-vis-meta
      type: rendering_to_vision_metadata
      active: False
      requires_embedding_service: False
      n_concurrent_queue_workers: 256
      requires_rendering: True
      useRenderingServiceAccount: True
      requires_vision_metadata: True
      vision_endpoint: {}

    # -- (map)
    # @raw
    #
    # Generation of Vision metadata from thumbnails of assets stored on the Storage backend. GIF thumbnails are also supported — GIF files are split into multiple frames by sampling every Nth frame (default: every frame), capped at a maximum number of frames (default: ``512``), configurable via the optional ``gif_sampling_mode`` (``fixed`` = every Nth frame, or ``uniform`` = ``gif_max_frames`` frames spread evenly across the GIF), ``gif_frame_sample_frequency``, and ``gif_max_frames`` parameters. Please refer to the [Thumbnail indexing settings](#thumbnail-indexing-settings) section for more information on how to configure the service to read GIF thumbnails.
    #
    # @notationType -- yaml
    thumbnail_to_vision_metadata:
      preview_name: thumb-vis-meta
      type: thumbnail_to_vision_metadata
      active: False
      requires_thumbnail_settings: True
      requires_embedding_service: False
      requires_rendering: False
      requires_vision_metadata: True
      vision_endpoint: {}
      # gif_sampling_mode: fixed  # "fixed" (every Nth frame) or "uniform" (gif_max_frames frames spread evenly)
      # gif_frame_sample_frequency: 1
      # gif_max_frames: 512

##############################################
## Cache settings
##############################################
persistence:
  pvc:
    createPvc: false
    size: 50Gi
    storageClassName: ""
  type: emptyDir
  # persistentVolumeClaim:
  #   claimName: ""
  emptyDir:
    sizeLimit: 10Gi
  hostPath:
    path: /var/lib/omni/cache
    type: Directory

##############################################
## Ingress set-up
##############################################
#
# If any of the service endpoint had ingress type you need to additionally
# set ingress.enabled parameter from below to "true".

ingress:
  enabled: false
  annotations:
    ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"

# set-up metrics backend
metrics:
  enabled: true

# resources for the deployment
resources: {}

# # ------- END ----------------------------------------
# # ----------------------------------------------------

## Account to use
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

## Account to use for the rendering jobs
renderingJobServiceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

## Account to use for the rendering jobs
listerJobServiceAccount:
  # Specifies whether a service account should be created
  create: true
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

rbac:
  create: true

# service port that is used for testing
test_service:
  port: 8080

loggingConfig:
  version: 1
  disable_existing_loggers: False
  filters: {}
  formatters:
    default:
      format: '%(levelname)s %(asctime)s %(name)s - %(message)s'
  handlers:
    default:
      formatter: default
      class: logging.StreamHandler
      stream: ext://sys.stderr
  loggers:
    opensearch:
      level: ERROR
    search_utils.cache_utils:
      level: WARNING
    httpx:
      level: WARNING
    root:
      level: INFO
#      level: DEBUG
      handlers:
        - default

################################################################################
## Security Context configuration
################################################################################

podSecurityContext:
  fsGroup: 1001
  runAsUser: 1001
  runAsNonRoot: true

securityContext:
  readOnlyRootFilesystem: true

################################################################################
## END
################################################################################
