[project]
name = "openapi-merge"
version = "0.1.0"
description = "Merges OpenAPI specs from deepsearch-api, info-endpoint, and asset-graph-service into a unified spec for the USD Search API gateway."
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openapi_merge"]
