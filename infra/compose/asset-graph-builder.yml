services:
  # Graph-builder — built from the usdsearch image's test-runner stage
  # (docker/Dockerfile.usdsearch), which ships graph_builder + pxr, the packman
  # resolver stack, and the pytest toolchain. Runs the FastAPI server by default
  # (the asset_graph_generation plugin tests POST to it); run_tests_asset_graph_builder.sh
  # instead scales it to 0 and drives a one-off pytest via `docker compose run`.
  # Layer asset-graph-service.yml and minio.yml alongside this file, then add
  # asset-graph-builder.deps.yml to wire up the service dependencies.
  kit-worker:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.usdsearch
      target: test-runner
      args:
        # Public packman CDN archive; gates the ABI-matched resolver stack
        # (resolver + client default to the same CDN in the Dockerfile).
        OMNI_USD_STOCK_URL: ${OMNI_USD_STOCK_URL:-https://d4i3qtqj3r0z5.cloudfront.net/openusd@0.25.11-9-manylinux_2_35_x86_64-dynamic-release-py312.no_imaging.7z}
    container_name: kit-worker
    command: ["uvicorn", "graph_builder.service:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8100:8000"
    environment:
      ACCEPT_EULA: "Y"
      TEST_GRAPH_BUILDER: "True"
      # Opt-in sidecar/package-metadata ingestion (graph_builder/sidecar_metadata.py),
      # enabled here with the shipped example catalog so the tests that exercise this
      # compose stack (test_graph_builder_sidecar_metadata,
      # test_asset_graph_generation_sidecar_metadata) see it wired through a real
      # worker. The test-runner stage keeps the workspace source on disk.
      SIDECAR_METADATA_CONFIG_PATH: /app/services/asset-graph-builder/graph_builder/sidecar_metadata.simready.yaml
      AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
      AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
      OV_SERVER: ${OV_SERVER:-localhost}
      OV_USERNAME: ${OV_USERNAME:-}
      OV_PASSWORD: ${OV_PASSWORD:-}
      NUCLEUS_ACCESS_TOKEN_VDC_SAMPLE: ${NUCLEUS_ACCESS_TOKEN_VDC_SAMPLE:-undefined}
      MINIO_ENDPOINT: http://minio:9000
      GITLAB_CI: ${GITLAB_CI:-false}
      USE_SEMANTICS_API: ${USE_SEMANTICS_API:-True}
      INDEXED_PROPERTY_PREFIXES: "semantic:,isaac:,physics:"
      SEVAN_TOKEN_URL: ${SEVAN_TOKEN_URL:-}
      SEVAN_DEV_SCOPE: ${SEVAN_DEV_SCOPE:-}
      SEVAN_DEV_CLIENT_SECRET: ${SEVAN_DEV_CLIENT_SECRET:-}
      SEVAN_DEV_CLIENT_ID: ${SEVAN_DEV_CLIENT_ID:-}
