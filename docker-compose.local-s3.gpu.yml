# MinIO Backend — GPU plugin overrides.
#
# Points the GPU services from docker-compose.gpu-plugins.yml at MinIO.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-plugins.yml \
#     -f docker-compose.local-s3.yml -f docker-compose.local-s3.gpu.yml up --build

x-local-s3-gpu-env: &local-s3-gpu-env
  S3_STORAGE_AWS_ENDPOINT_URL: http://minio:9000
  S3_STORAGE_BUCKET_NAME: ${LOCAL_S3_BUCKET:-usdsearch-local}
  S3_STORAGE_REGION_NAME: us-east-1

services:
  rendering-job:
    environment:
      - S3_STORAGE_AWS_ENDPOINT_URL=http://minio:9000

  monitor-worker-thumbnail-generation:
    environment:
      <<: *local-s3-gpu-env

  monitor-worker-rendering-to-embedding:
    environment:
      <<: *local-s3-gpu-env
